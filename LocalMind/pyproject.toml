[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localmind"
version = "0.1.0-dev"
description = "LocalMind prototype project foundation and admin shell"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0.0",
  "psutil>=5.9.0",
  "itsdangerous>=2.1.0",
]

[project.optional-dependencies]
admin = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-multipart>=0.0.1",
  "jinja2>=3.1.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-timeout>=2.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "pydantic-settings>=2.0.0",
]
worker = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

testpaths = ["tests"]

[tool.ruff]
line-length = 88

target-version = "py310"
